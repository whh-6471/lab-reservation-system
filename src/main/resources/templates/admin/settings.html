<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('预约规则')}"></head>
<body>
<aside th:replace="~{fragments/common :: sidebar}"></aside>
<div class="main">
    <header th:replace="~{fragments/common :: topbar('预约规则配置')}"></header>

    <div class="content">
        <div th:replace="~{fragments/common :: alerts}"></div>

        <div class="form-layout">
            <section class="card">
                <div class="card-header">
                    <h3>预约规则设置</h3>
                    <span class="tag">全局生效</span>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/settings}" th:object="${configForm}" method="post" class="form-stack">
                        <div class="form-row">
                            <div class="form-item">
                                <label for="maxDurationHours">单次最长预约时长（小时）</label>
                                <input id="maxDurationHours" type="number" min="1" max="12"
                                       th:field="*{maxDurationHours}"/>
                                <p class="field-error" th:if="${#fields.hasErrors('maxDurationHours')}"
                                   th:errors="*{maxDurationHours}"></p>
                                <p class="field-hint">学生单次预约时长不能超过该值</p>
                            </div>
                            <div class="form-item">
                                <label for="advanceDays">最多提前预约天数（天）</label>
                                <input id="advanceDays" type="number" min="1" max="30" th:field="*{advanceDays}"/>
                                <p class="field-error" th:if="${#fields.hasErrors('advanceDays')}"
                                   th:errors="*{advanceDays}"></p>
                                <p class="field-hint">只能预约今天起该天数内的日期</p>
                            </div>
                        </div>

                        <div class="form-item">
                            <label for="bookingRules">预约规则说明</label>
                            <textarea id="bookingRules" rows="10" th:field="*{bookingRules}"
                                      placeholder="请填写预约规则，将在学生首页与预约页面展示"></textarea>
                            <p class="field-error" th:if="${#fields.hasErrors('bookingRules')}"
                               th:errors="*{bookingRules}"></p>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">保存规则</button>
                            <a class="btn btn-ghost" th:href="@{/admin/dashboard}">返回看板</a>
                            <span class="muted">保存后立即对新的预约生效</span>
                        </div>
                    </form>
                </div>
            </section>

            <aside class="side-column">
                <section class="card">
                    <div class="card-header">
                        <h3>当前规则概览</h3>
                    </div>
                    <div class="card-body">
                        <div class="desc-grid">
                            <div class="desc-item">
                                <span>单次最长时长</span>
                                <b th:text="${config.maxDurationHours + ' 小时'}">4 小时</b>
                            </div>
                            <div class="desc-item">
                                <span>最多提前预约</span>
                                <b th:text="${config.advanceDays + ' 天'}">7 天</b>
                            </div>
                        </div>
                        <div class="desc-block">
                            <span>规则说明</span>
                            <p th:text="${config.bookingRules}">规则说明</p>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <div class="card-header">
                        <h3>规则校验逻辑</h3>
                    </div>
                    <div class="card-body">
                        <ul class="rule-checks">
                            <li>预约日期需在今天至提前天数范围内</li>
                            <li>预约时段需落在实验室开放时间内</li>
                            <li>同一实验室同一时段不可重复预约</li>
                            <li>参与人数不能超过实验室容量</li>
                            <li>单次预约时长不超过最长预约时长</li>
                        </ul>
                    </div>
                </section>
            </aside>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

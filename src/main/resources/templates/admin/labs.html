<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('实验室管理')}"></head>
<body>
<aside th:replace="~{fragments/common :: sidebar}"></aside>
<div class="main">
    <header th:replace="~{fragments/common :: topbar('实验室管理')}"></header>

    <div class="content">
        <div th:replace="~{fragments/common :: alerts}"></div>

        <form class="filter-bar" method="get" th:action="@{/admin/labs}">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="实验室名称 / 编号 / 位置"/>
            <select name="status">
                <option value="">全部状态</option>
                <option value="AVAILABLE" th:selected="${status == 'AVAILABLE'}">开放中</option>
                <option value="MAINTENANCE" th:selected="${status == 'MAINTENANCE'}">维护中</option>
                <option value="CLOSED" th:selected="${status == 'CLOSED'}">已停用</option>
            </select>
            <button type="submit" class="btn btn-primary">查询</button>
            <a class="btn btn-ghost" th:href="@{/admin/labs}">重置</a>
        </form>

        <div class="form-layout">
            <section class="card">
                <div class="card-header">
                    <h3>实验室列表</h3>
                    <span class="tag" th:text="${'共 ' + pageData.totalElements + ' 个'}">共 0 个</span>
                </div>
                <div class="table-wrap" th:if="${not #lists.isEmpty(labs)}">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>编号</th>
                            <th>名称 / 位置</th>
                            <th>容量</th>
                            <th>开放时间</th>
                            <th>状态</th>
                            <th class="col-actions">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="lab : ${labs}">
                            <td><span class="lab-code" th:text="${lab.code}">LAB-A201</span></td>
                            <td>
                                <strong th:text="${lab.name}">实验室名称</strong>
                                <small class="cell-sub" th:text="${lab.location}">位置</small>
                            </td>
                            <td th:text="${lab.capacity + ' 人'}">40 人</td>
                            <td th:text="${lab.openRangeText}">08:00 - 20:00</td>
                            <td><span th:class="${lab.statusBadge}" th:text="${lab.statusText}">开放中</span></td>
                            <td class="col-actions">
                                <a class="btn btn-ghost btn-sm"
                                   th:href="@{/admin/labs(edit=${lab.id},keyword=${keyword},status=${status},page=${page})}">编辑</a>
                                <a class="btn btn-ghost btn-sm" th:href="@{/labs/{id}(id=${lab.id})}">时段</a>
                                <form class="inline-form" th:action="@{/admin/labs/{id}/delete(id=${lab.id})}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm"
                                            data-confirm="确定删除该实验室吗？已有预约或设备的实验室无法删除。">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="empty" th:if="${#lists.isEmpty(labs)}">暂无实验室数据</p>

                <div class="pager" th:if="${pageData.totalPages > 1}">
                    <a th:if="${pageData.hasPrevious()}"
                       th:href="@{/admin/labs(keyword=${keyword},status=${status},page=${pageData.number - 1})}">上一页</a>
                    <a th:each="i : ${pageNumbers}" th:classappend="${i == pageData.number} ? 'active'"
                       th:href="@{/admin/labs(keyword=${keyword},status=${status},page=${i})}"
                       th:text="${i + 1}">1</a>
                    <a th:if="${pageData.hasNext()}"
                       th:href="@{/admin/labs(keyword=${keyword},status=${status},page=${pageData.number + 1})}">下一页</a>
                </div>
            </section>

            <aside class="side-column">
                <section class="card">
                    <div class="card-header">
                        <h3 th:text="${labForm.id == null ? '新增实验室' : '编辑实验室'}">新增实验室</h3>
                        <a class="btn btn-ghost btn-sm" th:if="${labForm.id != null}" th:href="@{/admin/labs}">取消编辑</a>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/labs/save}" th:object="${labForm}" method="post" class="form-stack">
                            <input type="hidden" th:field="*{id}"/>

                            <div class="form-item">
                                <label for="code">实验室编号</label>
                                <input id="code" type="text" th:field="*{code}" placeholder="如 LAB-A201"/>
                                <p class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></p>
                            </div>

                            <div class="form-item">
                                <label for="name">实验室名称</label>
                                <input id="name" type="text" th:field="*{name}" placeholder="如 计算机实验室 A201"/>
                                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                            </div>

                            <div class="form-item">
                                <label for="location">所在位置</label>
                                <input id="location" type="text" th:field="*{location}" placeholder="如 实验楼A座 2层"/>
                                <p class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></p>
                            </div>

                            <div class="form-row">
                                <div class="form-item">
                                    <label for="capacity">可容纳人数</label>
                                    <input id="capacity" type="number" min="1" max="500" th:field="*{capacity}"/>
                                    <p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
                                </div>
                                <div class="form-item">
                                    <label for="status">实验室状态</label>
                                    <select id="status" th:field="*{status}">
                                        <option value="AVAILABLE">开放中</option>
                                        <option value="MAINTENANCE">维护中</option>
                                        <option value="CLOSED">已停用</option>
                                    </select>
                                    <p class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-item">
                                    <label for="openStart">开放开始时间</label>
                                    <input id="openStart" type="time" th:field="*{openStart}" step="900"/>
                                    <p class="field-error" th:if="${#fields.hasErrors('openStart')}"
                                       th:errors="*{openStart}"></p>
                                </div>
                                <div class="form-item">
                                    <label for="openEnd">开放结束时间</label>
                                    <input id="openEnd" type="time" th:field="*{openEnd}" step="900"/>
                                    <p class="field-error" th:if="${#fields.hasErrors('openEnd')}" th:errors="*{openEnd}"></p>
                                </div>
                            </div>

                            <div class="form-item">
                                <label for="description">实验室简介</label>
                                <textarea id="description" rows="3" th:field="*{description}"
                                          placeholder="简要说明实验室用途与配置"></textarea>
                                <p class="field-error" th:if="${#fields.hasErrors('description')}"
                                   th:errors="*{description}"></p>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary"
                                        th:text="${labForm.id == null ? '新增实验室' : '保存修改'}">新增实验室</button>
                                <a class="btn btn-ghost" th:href="@{/admin/labs}">重置</a>
                            </div>
                        </form>
                    </div>
                </section>
            </aside>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

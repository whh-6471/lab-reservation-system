<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('我的预约')}"></head>
<body>
<aside th:replace="~{fragments/common :: sidebar}"></aside>
<div class="main">
    <header th:replace="~{fragments/common :: topbar('我的预约记录')}"></header>

    <div class="content">
        <div th:replace="~{fragments/common :: alerts}"></div>

        <form class="filter-bar" method="get" th:action="@{/reservations/my}">
            <select name="status">
                <option value="">全部状态</option>
                <option value="PENDING" th:selected="${status == 'PENDING'}">待审核</option>
                <option value="APPROVED" th:selected="${status == 'APPROVED'}">已通过</option>
                <option value="REJECTED" th:selected="${status == 'REJECTED'}">已驳回</option>
                <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">已取消</option>
                <option value="EXPIRED" th:selected="${status == 'EXPIRED'}">已过期</option>
            </select>
            <select name="labId">
                <option value="">全部实验室</option>
                <option th:each="lab : ${labs}" th:value="${lab.id}" th:text="${lab.name}"
                        th:selected="${labId != null and labId == lab.id}">实验室</option>
            </select>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="实验名称 / 申请人"/>
            <input type="date" name="date" th:value="${date}"/>
            <button type="submit" class="btn btn-primary">查询</button>
            <a class="btn btn-ghost" th:href="@{/reservations/my}">重置</a>
            <a class="btn btn-ghost" th:href="@{/reservations/new}">新建预约</a>
        </form>

        <div class="card">
            <div class="card-header">
                <h3>预约列表</h3>
                <span class="tag" th:text="${'共 ' + pageData.totalElements + ' 条'}">共 0 条</span>
            </div>
            <div class="table-wrap" th:if="${not #lists.isEmpty(reservations)}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>实验名称</th>
                        <th>实验室</th>
                        <th>预约时间</th>
                        <th>人数</th>
                        <th>状态</th>
                        <th>提交时间</th>
                        <th class="col-actions">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${reservations}">
                        <td>
                            <strong th:text="${r.title}">实验名称</strong>
                            <small class="cell-sub" th:text="${r.purpose}">实验用途</small>
                        </td>
                        <td>
                            <span th:text="${r.labName}">实验室</span>
                            <small class="cell-sub" th:text="${r.labLocation}">位置</small>
                        </td>
                        <td>
                            <span th:text="${r.reservationDateText}">日期</span>
                            <small class="cell-sub" th:text="${r.timeRangeText}">时间</small>
                        </td>
                        <td th:text="${r.participantCount}">1</td>
                        <td><span th:class="${r.statusBadge}" th:text="${r.statusText}">状态</span></td>
                        <td th:text="${r.createTimeText}">提交时间</td>
                        <td class="col-actions">
                            <a class="btn btn-ghost btn-sm" th:href="@{/reservations/{id}(id=${r.id})}">详情</a>
                            <form class="inline-form" th:if="${(r.status == 'PENDING' or r.status == 'APPROVED') and !r.started}"
                                  th:action="@{/reservations/{id}/cancel(id=${r.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        data-confirm="确定取消该预约吗？">取消</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="empty" th:if="${#lists.isEmpty(reservations)}">暂无预约记录，去预约实验室吧</p>

            <div class="pager" th:if="${pageData.totalPages > 1}">
                <a th:if="${pageData.hasPrevious()}"
                   th:href="@{/reservations/my(status=${status},labId=${labId},keyword=${keyword},date=${date},page=${pageData.number - 1})}">上一页</a>
                <a th:each="i : ${pageNumbers}" th:classappend="${i == pageData.number} ? 'active'"
                   th:href="@{/reservations/my(status=${status},labId=${labId},keyword=${keyword},date=${date},page=${i})}"
                   th:text="${i + 1}">1</a>
                <a th:if="${pageData.hasNext()}"
                   th:href="@{/reservations/my(status=${status},labId=${labId},keyword=${keyword},date=${date},page=${pageData.number + 1})}">下一页</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

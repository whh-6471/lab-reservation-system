<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('登录')}"></head>
<body class="auth-body">
<div class="auth-layout">
    <section class="auth-brand">
        <div class="auth-brand-inner">
            <div class="brand-mark brand-mark-lg">
                <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
                    <path d="M9 3h6v2h-1v5.2l4.6 8.1A2 2 0 0 1 16.8 21H7.2a2 2 0 0 1-1.8-2.7L10 10.2V5H9V3z"
                          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M8.4 15h7.2" stroke="currentColor" stroke-width="1.6"/>
                </svg>
            </div>
            <h1>高校实验室<br/>预约管理系统</h1>
            <p class="auth-slogan">统筹实验资源 · 规范预约流程 · 保障实验安全</p>
            <ul class="brand-points">
                <li><span></span>在线查看实验室空闲时段，一键提交预约</li>
                <li><span></span>教师在线审核，预约状态实时流转</li>
                <li><span></span>设备台账全生命周期管理，资产清晰可查</li>
            </ul>
            <div class="auth-brand-foot">
                <p>Laboratory Reservation Platform</p>
            </div>
        </div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <div class="auth-tabs">
                <a class="active" th:href="@{/login}">登录</a>
                <a th:href="@{/register}">注册</a>
            </div>
            <h2>欢迎回来</h2>
            <p class="auth-hint">请使用校园账号登录系统</p>

            <div class="alert alert-success" th:if="${logoutNotice}">您已安全退出系统</div>
            <div class="alert alert-success" th:if="${registeredNotice}">注册成功，请使用新账号登录</div>
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/login}" th:object="${loginForm}" method="post" class="form-stack">
                <div class="form-item">
                    <label for="username">登录账号</label>
                    <input id="username" type="text" th:field="*{username}" placeholder="请输入账号，如 s001"
                           autocomplete="username"/>
                    <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>
                <div class="form-item">
                    <label for="password">登录密码</label>
                    <input id="password" type="password" th:field="*{password}" placeholder="请输入密码"
                           autocomplete="current-password"/>
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录系统</button>
            </form>

            <div class="demo-accounts">
                <p>演示账号（密码均为 123456）</p>
                <div class="demo-tags">
                    <span>管理员 admin</span>
                    <span>教师 t001</span>
                    <span>学生 s001</span>
                </div>
            </div>

            <p class="auth-switch">还没有账号？<a th:href="@{/register}">立即注册</a></p>
        </div>
    </section>
</div>
</body>
</html>

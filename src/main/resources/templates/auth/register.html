<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('注册')}"></head>
<body class="auth-body">
<div class="auth-layout">
    <section class="auth-brand">
        <div class="auth-brand-inner">
            <div class="brand-mark brand-mark-lg">
                <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
                    <path d="M9 3h6v2h-1v5.2l4.6 8.1A2 2 0 0 1 16.8 21H7.2a2 2 0 0 1-1.8-2.7L10 10.2V5H9V3z"
                          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M8.4 15h7.2" stroke="currentColor" stroke-width="1.6"/>
                </svg>
            </div>
            <h1>学生账号注册</h1>
            <p class="auth-slogan">注册后即可在线预约实验室并查看设备台账</p>
            <ul class="brand-points">
                <li><span></span>注册账号默认角色为学生</li>
                <li><span></span>预约提交后由教师审核</li>
                <li><span></span>可在个人中心完善资料与修改密码</li>
            </ul>
        </div>
    </section>

    <section class="auth-panel">
        <div class="auth-card">
            <div class="auth-tabs">
                <a th:href="@{/login}">登录</a>
                <a class="active" th:href="@{/register}">注册</a>
            </div>
            <h2>创建学生账号</h2>
            <p class="auth-hint">请填写真实信息，便于预约审核</p>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form-stack">
                <div class="form-row">
                    <div class="form-item">
                        <label for="username">登录账号</label>
                        <input id="username" type="text" th:field="*{username}" placeholder="3-20 个字符"/>
                        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    </div>
                    <div class="form-item">
                        <label for="realName">真实姓名</label>
                        <input id="realName" type="text" th:field="*{realName}" placeholder="请输入姓名"/>
                        <p class="field-error" th:if="${#fields.hasErrors('realName')}" th:errors="*{realName}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-item">
                        <label for="password">登录密码</label>
                        <input id="password" type="password" th:field="*{password}" placeholder="6-20 位密码"/>
                        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>
                    <div class="form-item">
                        <label for="confirmPassword">确认密码</label>
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                               placeholder="再次输入密码"/>
                        <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errors="*{confirmPassword}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-item">
                        <label for="studentNo">学号</label>
                        <input id="studentNo" type="text" th:field="*{studentNo}" placeholder="请输入学号"/>
                    </div>
                    <div class="form-item">
                        <label for="department">所属院系</label>
                        <input id="department" type="text" th:field="*{department}" placeholder="如 计算机科学与技术学院"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-item">
                        <label for="phone">联系电话</label>
                        <input id="phone" type="text" th:field="*{phone}" placeholder="请输入手机号"/>
                    </div>
                    <div class="form-item">
                        <label for="email">电子邮箱</label>
                        <input id="email" type="email" th:field="*{email}" placeholder="name@campus.edu.cn"/>
                        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">提交注册</button>
            </form>

            <p class="auth-switch">已有账号？<a th:href="@{/login}">返回登录</a></p>
        </div>
    </section>
</div>
</body>
</html>
